<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008175;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8FEFA;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0f0f"/>

  <!-- Letter A -->
  <path d="M200 80 L300 320 L260 320 L235 260 L165 260 L140 320 L100 320 Z
           M180 230 L220 230 L200 170 Z"
        fill="url(#gradBA)" filter="url(#glow)"/>

  <!-- Letter B integrated -->
  <path d="M140 120 L200 120
           C250 120, 250 180, 200 180
           L140 180 Z
           M140 180 L210 180
           C270 180, 260 260, 200 260
           L140 260 Z"
        fill="none" stroke="url(#gradBA)" stroke-width="12" filter="url(#glow)"/>

  <!-- Optional developer tag -->
  <text x="200" y="360" text-anchor="middle" fill="#C8FEFA" font-size="22" font-family="Arial">
    DEV
  </text>
</svg>